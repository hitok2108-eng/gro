<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Назначить админа</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:40px;
}

.panel{
background:#1a1a1a;
padding:20px;
border-radius:10px;
max-width:400px;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
background:#222;
border:none;
color:white;
}

button{
margin-top:15px;
padding:10px;
width:100%;
background:#3a3aff;
border:none;
color:white;
cursor:pointer;
}

.remove{
background:#ff4444;
}

</style>
</head>

<body>

<div class="panel">

<h2>Назначить админа</h2>

<form action="/add_admin" method="POST">

<input name="username" placeholder="Username">

<select name="chat_id">

<option value="1">Магазин Mario</option>
<option value="2">Магазин Fast</option>
<option value="3">Магазин Samurai</option>
<option value="4">Магазин Green</option>
<option value="5">Магазин Brat</option>

</select>

<button type="submit">Назначить</button>

</form>

<hr>

<h2>Снять админа</h2>

<form action="/remove_admin" method="POST">

<input name="username" placeholder="Username">

<select name="chat_id">

<option value="1">Магазин Mario</option>
<option value="2">Магазин Fast</option>
<option value="3">Магазин Samurai</option>
<option value="4">Магазин Green</option>
<option value="5">Магазин Brat</option>

</select>

<button class="remove" type="submit">Снять</button>

</form>

</div>

</body>
</html>
